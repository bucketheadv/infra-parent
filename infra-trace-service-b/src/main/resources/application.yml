spring:
  application:
    name: infra-trace-service-b

server:
  port: ${TRACE_SERVICE_B_PORT:18092}

infra:
  trace:
    enabled: true
    report:
      enabled: ${TRACE_REPORT_ENABLED:true}
      url: ${TRACE_ADMIN_URL:http://127.0.0.1:18090/api/trace/spans}
      logs-url: ${TRACE_ADMIN_URL:http://127.0.0.1:18090}/api/trace/logs
      # 演示采集入参、返回值、请求头与调用栈（生产可按需开关）
      capture-request-body: true
      capture-response-body: true
      capture-request-headers: true
      capture-call-stack: true
      # 调用栈仅保留业务包内的帧（API 入口及其内部方法），过滤框架帧
      call-stack-include-prefix: io.infra.structure.trace.service.b
      max-body-length: 2000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] [%X{spanId}] [%X{parentSpanId}] - %msg%n"
