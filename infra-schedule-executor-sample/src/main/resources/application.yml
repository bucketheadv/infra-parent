spring:
  application:
    name: infra-schedule-executor-sample

server:
  port: ${SCHEDULE_EXECUTOR_PORT:18081}

infra:
  schedule:
    enabled: true
    executor:
      enabled: true
      name: ${SCHEDULE_EXECUTOR_NAME:样例执行器}
      group: ${SCHEDULE_EXECUTOR_GROUP:infra-schedule-executor-sample}
      # 必须是调度中心能访问到的地址；分机部署时不要用 127.0.0.1。
      address: ${SCHEDULE_EXECUTOR_ADDRESS:http://127.0.0.1:18081}
      admin-address: ${SCHEDULE_ADMIN_ADDRESS:http://127.0.0.1:18080}
      access-token: ${SCHEDULE_ACCESS_TOKEN:}
      auth-enabled: ${SCHEDULE_EXECUTOR_AUTH_ENABLED:false}
      connect-timeout-millis: 3000
      read-timeout-millis: 30000
      heartbeat-interval-millis: 10000
