<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{rocketmq-layout :: layout('Topic 管理', 'topics', ~{::main})}">
<head></head>
<body>
<main class="main-content" th:fragment="main">
    <header class="page-header">
        <div>
            <p class="eyebrow">消息主题</p>
            <h1 th:text="${topicName}">topic</h1>
            <p class="subtitle" id="topic-detail-subtitle">正在加载详情</p>
        </div>
        <div class="toolbar">
            <a class="secondary-button" th:href="@{/topics}">返回列表</a>
            <button class="icon-button" type="button" id="refresh-button" title="刷新" aria-label="刷新">↻</button>
        </div>
    </header>

    <section class="metrics dashboard-metrics topic-metrics" aria-label="Topic 概览">
        <article class="metric metric-total">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">←</span><div><span class="metric-label">读取分片</span><span class="metric-route">Consumer · 队列拉取</span></div></div>
            <div class="metric-reading"><strong id="read-queue-count">-</strong><span>个队列</span></div>
            <div class="metric-footer"><p class="metric-note">消费端并行读取通道</p><span class="metric-state"><i></i>可读取</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
        <article class="metric metric-started">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">→</span><div><span class="metric-label">写入分片</span><span class="metric-route">Producer · 消息投递</span></div></div>
            <div class="metric-reading"><strong id="write-queue-count">-</strong><span>个队列</span></div>
            <div class="metric-footer"><p class="metric-note">生产端并行写入通道</p><span class="metric-state"><i></i>可写入</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
        <article class="metric metric-stopped">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">□</span><div><span class="metric-label">访问权限</span><span class="metric-route">Topic · 权限位控制</span></div></div>
            <div class="metric-reading"><strong id="topic-perm">-</strong><span>当前策略</span></div>
            <div class="metric-footer"><p class="metric-note">生产与消费访问范围</p><span class="metric-state"><i></i>已配置</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
        <article class="metric metric-online">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">◎</span><div><span class="metric-label">订阅消费</span><span class="metric-route">Group · 消息处理</span></div></div>
            <div class="metric-reading"><strong id="consumer-count">-</strong><span>个消费组</span></div>
            <div class="metric-footer"><p class="metric-note">正在订阅该 Topic 的消费组</p><span class="metric-state"><i></i>已订阅</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
    </section>

    <section class="panel" aria-labelledby="queues-heading">
        <div class="panel-header">
            <div>
                <h2 id="queues-heading">队列位点</h2>
                <p id="queues-count-label">正在加载</p>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Broker</th><th>队列 ID</th><th>最小位点</th><th>最大位点</th><th>消息数</th><th>最后更新时间</th></tr></thead>
                <tbody id="queues-body"></tbody>
            </table>
            <div class="empty-state" id="queues-empty" hidden>无队列位点数据</div>
        </div>
    </section>

    <section class="panel" aria-labelledby="consumers-heading">
        <div class="panel-header">
            <div>
                <h2 id="consumers-heading">订阅消费组</h2>
                <p id="consumers-count-label">正在加载</p>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>消费组</th></tr></thead>
                <tbody id="consumers-body"></tbody>
            </table>
            <div class="empty-state" id="consumers-empty" hidden>暂无订阅消费组</div>
        </div>
    </section>
</main>
</body>
</html>
