<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{rocketmq-layout :: layout('仪表盘', 'dashboard', ~{::main})}">
<head></head>
<body>
<main class="main-content" th:fragment="main">
    <header class="page-header">
        <div>
            <p class="eyebrow">集群概览</p>
            <h1>仪表盘</h1>
            <p class="subtitle">NameServer 与 Broker 运行概况</p>
        </div>
        <button class="icon-button" type="button" id="refresh-button" title="刷新" aria-label="刷新">↻</button>
    </header>

    <section class="metrics metrics-3 dashboard-metrics" aria-label="集群概览">
        <article class="metric metric-total">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">◇</span><div><span class="metric-label">Broker 网络</span><span class="metric-route">NameServer · 节点注册</span></div></div>
            <div class="metric-reading"><strong id="broker-count">-</strong><span>个节点</span></div>
            <div class="metric-footer"><p class="metric-note">主从 Broker 连接状态</p><span class="metric-state"><i></i>可用</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
        <article class="metric metric-started">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">▤</span><div><span class="metric-label">Topic 路由</span><span class="metric-route">消息发布 · 队列分发</span></div></div>
            <div class="metric-reading"><strong id="topic-count">-</strong><span>个主题</span></div>
            <div class="metric-footer"><p class="metric-note">业务 Topic（不含系统主题）</p><span class="metric-state"><i></i>路由中</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
        <article class="metric metric-stopped">
            <div class="metric-flow"><span class="metric-symbol" aria-hidden="true">≡</span><div><span class="metric-label">消费链路</span><span class="metric-route">订阅关系 · 消费进度</span></div></div>
            <div class="metric-reading"><strong id="consumer-group-count">-</strong><span>个消费组</span></div>
            <div class="metric-footer"><p class="metric-note">订阅并消费消息的客户端</p><span class="metric-state"><i></i>监听中</span></div>
            <div class="metric-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </article>
    </section>

    <section class="panel" aria-labelledby="brokers-heading">
        <div class="panel-header">
            <div>
                <h2 id="brokers-heading">Broker 列表</h2>
                <p id="broker-count-label">正在加载</p>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>地址</th><th>集群</th><th>Broker</th><th>角色</th><th>版本</th></tr></thead>
                <tbody id="brokers-body"></tbody>
            </table>
            <div class="empty-state" id="brokers-empty" hidden>暂无 Broker 注册</div>
        </div>
    </section>
</main>
</body>
</html>
