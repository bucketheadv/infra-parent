server:
  port: 8081
  servlet:
    session:
      # 本地 OAuth2 Client 会话与登录中心保持相同的 3 天有效期。
      timeout: 3d
      cookie:
        max-age: 3d
        # 仅在同一主机名（如 localhost）部署多个应用时需要；Cookie 不按端口隔离。
        name: INFRA_ACTIVITY_SESSION

spring:
  jackson:
    # 全局 Mapper 读取此配置，将接口字段序列化为 snake_case。
    property-naming-strategy: SNAKE_CASE
    # 接口响应仅省略 null 字段，空字符串与空集合保留。
    default-property-inclusion: NON_NULL
  datasource:
    # 活动配置使用独立数据库；可通过 ACTIVITY_DB_* 环境变量覆盖。
    url: ${ACTIVITY_DB_URL:jdbc:mysql://localhost:3306/infra_activity}
    username: ${ACTIVITY_DB_USERNAME:root}
    password: ${ACTIVITY_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          infra-activity:
            client-id: infra-activity
            client-secret: activity-secret
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8081/login/oauth2/code/infra-activity
            scope:
              - openid
              - profile
              - email
        provider:
          infra-activity:
            issuer-uri: http://localhost:9000

infra:
  sso:
    enabled: true
    issuer-uri: http://localhost:9000
    audience: infra-activity
    permit-all:
      - /error
      - /api/public/**
      - /infra-activity/**
    client:
      enabled: true
      registration-id: infra-activity
      pkce-enabled: true
      post-logout-redirect-uri: "{baseUrl}/"
