spring:
  application:
    name: infra-schedule-admin
  datasource:
    url: ${SCHEDULE_DB_URL:jdbc:mysql://127.0.0.1:3306/infra_schedule?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SCHEDULE_DB_USERNAME:root}
    password: ${SCHEDULE_DB_PASSWORD:123456}

# 8080 常被其他本地服务占用，调度管理后台固定使用独立端口。
server:
  port: ${SCHEDULE_ADMIN_PORT:18080}

infra:
  schedule:
    enabled: true
    scheduler-id: ${SCHEDULE_SCHEDULER_ID:infra-schedule-admin-1}
    scan-interval-millis: 1000
    dispatch-batch-size: 100
    dispatch-max-pages: 10
    claim-lease-millis: 60000
    worker-threads: 8
    worker-queue-capacity: 1000
    max-execution-millis: 3600000
    cover-early-wait-millis: 5000
    execution-log-retention-millis: 2592000000
    execution-log-cleanup-batch-size: 1000
    trigger-outbox-retention-millis: 2592000000
    trigger-outbox-cleanup-batch-size: 1000
    scheduler-threads: 4
    executor:
      enabled: false
      auth-enabled: ${SCHEDULE_EXECUTOR_AUTH_ENABLED:false}
      access-token: ${SCHEDULE_ACCESS_TOKEN:}
    management:
      enabled: true
      auth-enabled: ${SCHEDULE_ADMIN_AUTH_ENABLED:false}
      access-token: ${SCHEDULE_ADMIN_ACCESS_TOKEN:}
