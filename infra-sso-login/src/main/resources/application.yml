server:
  port: 9000
  servlet:
    session:
      cookie:
        # Spring Session 使用此 Cookie 名称；同一主机部署多个应用时，Cookie 不按端口隔离。
        max-age: 3d
        name: INFRA_SSO_LOGIN_SESSION

spring:
  session:
    # 服务端登录会话存入 MySQL，3 天无访问后过期；应用重启不会清空仍有效的会话。
    timeout: 3d
    jdbc:
      # 会话表由项目迁移脚本维护，避免应用启动时自动执行 DDL。
      initialize-schema: never
  datasource:
    url: jdbc:mysql://localhost:3306/infra_sso
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

infra:
  sso:
    login:
      issuer: http://localhost:9000
      clients:
        infra-activity:
          client-id: infra-activity
          client-secret: activity-secret
          redirect-uris:
            - http://localhost:8081/login/oauth2/code/infra-activity
          post-logout-redirect-uris:
            - http://localhost:8081/
          scopes:
            - openid
            - profile
            - email
          require-proof-key: true
